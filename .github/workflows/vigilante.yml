name: Vigilante de ofertas

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min (hora UTC; GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write             # para guardar el estado (ofertas vistas) en el repo

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Revisar ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 vigilante.py

      - name: Guardar estado
        run: |
          git config user.name "vigilante-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet && exit 0
          git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push --quiet
