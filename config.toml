# Configuración del vigilante de ofertas.
# Las expresiones (incluye / excluye) se buscan en el TÍTULO de la oferta, sin importar mayúsculas.

umbral_hot = 300              # grados en Promodescuentos para avisar las categorías "normal" (100 = popular, 300+ = muy buena)
max_alertas_por_corrida = 10  # el resto se va al resumen
horas_silencio = [23, 7]      # de 23:00 a 7:00 las alertas llegan sin sonido
dias_recordar = 21            # cuántos días se recuerda una oferta ya vista
max_horas_publicada = 48      # ofertas publicadas antes de esto se ignoran
max_paginas_por_corrida = 120 # páginas de oferta que se revisan (vigencia y grados) en cada corrida

feeds = [
  "https://www.promodescuentos.com/rss/new",
  "https://www.promodescuentos.com/rss/hot",
  "https://www.promodescuentos.com/rss/grupo/tarjetas-graficas",
  "https://www.promodescuentos.com/rss/grupo/memoria-ram",
  "https://www.promodescuentos.com/rss/grupo/laptops",
  "https://www.promodescuentos.com/rss/grupo/ssd",
  "https://www.promodescuentos.com/rss/grupo/monitores",
  "https://www.promodescuentos.com/rss/grupo/procesadores",
  "https://www.promodescuentos.com/rss/grupo/cargadores",
]

# Palabras que indican un posible error de precio: se avisa siempre.
error_precio = 'error de precio|errorazo|bug de precio|glitch|precio err[oó]neo|preciazo'

# Laptops reacondicionadas: se marcan para revisar garantía y vendedor.
reacondicionado = 'reacondicionad|renewed|seminuev|refurbished|open box'

# El orden importa: la primera categoría que coincide se queda con la oferta.
# prioridad: alta = avisa cada oferta nueva · normal = avisa si está caliente · baja = solo resumen

[[categoria]]
nombre = "UGREEN"
emoji = "🔌"
prioridad = "normal"
incluye = 'ugreen'

[[categoria]]
nombre = "Laptop"
emoji = "💻"
prioridad = "normal"
incluye = 'windows 11|win 11|laptop|notebook|computadora port[aá]til|\btuf\b|zephyrus|strix|inspiron|pavilion|aspire|yoga|thinkbook|copilot\+? pc|aero x|snapdragon x|macbook|thinkpad|latitude|elitebook|probook|chromebook|vivobook|zenbook|ideapad|\bloq\b|legion|victus|omen|nitro|predator|rog |tuf gaming'
excluye = 'memoria ram|ram gamer|so-?dimm|monitor|consola|xbox|ally|steam deck|mini ?pc|all in one|escritorio|mochila|funda|base para|soporte para|cargador|teclado para|malet[ií]n|enfriador|cooler'

